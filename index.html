<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Score Analyzer</title>
  
  <!-- BOOTSTRAP JS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-center mt-4 flex-grow-1">
  <h1 class="score-title">Score Analyzer</h1>

  <details class="mb-3">
    <summary style="cursor: pointer; font-weight: bold;">Click to see note</summary>
    <div class="alert alert-info mt-2">
      Note: Grading Criteria and Equivalents can vary depending on school or district.
    </div>
  </details>


  <div class="custom-container mx-auto mt-4">
    <div class="row justify-content-center">
  <strong><p class="instruction-text">Please Enter the grades in the following subjects.</p></strong>
  
  <!-- Science -->
  <div class="col-md-3 subject-card">
    <img src="https://img.freepik.com/free-vector/colorful-science-education-background_23-2148490697.jpg" class="img-fluid subject-img" alt="Science">
    <input type="number" class="form-control grade-input" id="science" placeholder="Enter Science grade" min="70" max="100">
  </div>

  <!-- Math -->
  <div class="col-md-3 subject-card">
    <img src="https://img.freepik.com/premium-vector/mathematics-vector-concept-round-outline-colored-illustration_104589-1426.jpg" class="img-fluid subject-img" alt="Math">
    <input type="number" class="form-control grade-input" id="math" placeholder="Enter Math grade" min="70" max="100">
  </div>

  <!-- Social Studies -->
  <div class="col-md-3 subject-card">
    <img src="https://cn.edurev.in/AllImages/original/ApplicationImages/CourseImages/9607a9b0-436f-48f8-b8a4-2841b05cbebe_CI.png" class="img-fluid subject-img" alt="SocialStudies">
    <input type="number" class="form-control grade-input" id="socialStudies" placeholder="Enter Social Studies grade" min="70" max="100">
  </div>

        <div class="text-center mt-4">
          <button class="btn btn-primary me-2" onclick="calculateAverage()">Get Rating</button>
          <button class="btn custom-refresh-btn" onclick="reloadPage()">Refresh</button>
        </div>
      </div>
  </div>
</div>

    <footer class="footer">
  <p>A.Y. 2024-2025 | David Miguel A. Reyes | Grade-9R | ICT Quiz#2</p>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- External JS -->
  <script src="main.js"></script>
</body>
</html>
